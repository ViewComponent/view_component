name: CI

permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  benchmark:
    if: always()
    needs: benchmark-rails
    runs-on: ubuntu-latest
    steps:
    - name: Check benchmark results
      env:
        RESULT: ${{ needs.benchmark-rails.result }}
      run: test "$RESULT" = success || test "$RESULT" = skipped
  benchmark-comment:
    name: Comment on release benchmarks
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'release-') }}
    needs: benchmark-rails
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: release-benchmark-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
    - name: Download benchmark results
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        pattern: performance-rails-*
        path: artifacts
    - name: Post release benchmark results
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
        if [ "$current_head" != "$HEAD_SHA" ]; then
          echo "Skipping results for an outdated pull request revision."
          exit 0
        fi

        {
          printf '<!-- view-component-release-benchmarks -->\n## Release benchmark results\n\n'
          printf '[Workflow run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          for rails in 8.1 main; do
            printf '\n## Rails %s\n\n' "$rails"
            report="artifacts/performance-rails-$rails/report.md"
            if [ -f "$report" ]; then
              cat "$report"
            else
              echo "Benchmark results are unavailable. See the workflow run for errors."
              echo "::warning::No benchmark report for Rails $rails" >&2
            fi
          done
        } > benchmark-comment.md

        comment_id=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" |
          jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- view-component-release-benchmarks -->")))] | first | .id // empty')
        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
            --field body=@benchmark-comment.md --silent
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --field body=@benchmark-comment.md --silent
        fi
  benchmark-rails:
    name: benchmark (Rails ${{ matrix.rails_version }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rails_version: ["8.1", "main"]
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails_version }}.gemfile
      RELEASE_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.base.sha }}
        path: tmp/base
        fetch-depth: ${{ env.RELEASE_PR == 'true' && '0' || '1' }}
    - name: Use previous release as benchmark base
      if: env.RELEASE_PR == 'true'
      id: release
      working-directory: tmp/base
      shell: bash
      run: |
        tag=$(git describe --first-parent --tags --abbrev=0 --match 'v[0-9]*')
        git checkout --detach "$tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Setup Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
      with:
        ruby-version: 4.0
        bundler-cache: true
    - name: Compare performance against base
      shell: bash
      env:
        PASSES: 5
        BASE_REF: ${{ steps.release.outputs.tag || github.event.pull_request.base.sha }}
      run: |
        for round in 1 2 3; do
          VIEW_COMPONENT_LIB=tmp/base/lib bundle exec ruby performance/measure.rb "tmp/performance/base/$round.json"
          bundle exec ruby performance/measure.rb "tmp/performance/head/$round.json"
        done
        {
          printf 'Base: `%s`; head: `%s` (pull request merge commit).\n\n' "$BASE_REF" "$GITHUB_SHA"
          bundle exec ruby performance/compare.rb tmp/performance/base tmp/performance/head
        } | tee -a "$GITHUB_STEP_SUMMARY" tmp/performance/report.md
    - name: Upload performance results
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: always()
      with:
        name: performance-rails-${{ matrix.rails_version }}
        path: tmp/performance
  test:
    name: test (Rails ${{ matrix.rails_version }}, Ruby ${{ matrix.ruby_version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby_version == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby_version: "3.2"
            rails_version: "7.1"
          - ruby_version: "3.3"
            rails_version: "7.2"
          - ruby_version: "3.4"
            rails_version: "8.0"
          - ruby_version: "4.0"
            rails_version: "8.1"
          - ruby_version: "4.0"
            rails_version: "main"
          - ruby_version: "head"
            rails_version: "main_head"
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails_version }}.gemfile
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
        bundler-cache: true
    - name: Build and test with Rake
      run: |
        bundle exec appraisal rails-${{ matrix.rails_version }} bundle --quiet
        MEASURE_COVERAGE=true bundle exec appraisal rails-${{ matrix.rails_version }} rake all_tests
      env:
        RAILS_VERSION: ${{ matrix.rails_version }}
        RUBY_VERSION: ${{ matrix.ruby_version }}
    - name: Upload coverage results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: simplecov-resultset-rails${{matrix.rails_version}}-ruby${{matrix.ruby_version}}-${{matrix.mode}}
        path: coverage
        include-hidden-files: true
  primer_view_components_compatibility:
    name: Test compatibility with Primer ViewComponents (main)
    if: always()
    needs: primer_view_components_tests
    runs-on: ubuntu-latest
    steps:
    - name: Check compatibility results
      env:
        RESULT: ${{ needs.primer_view_components_tests.result }}
      run: test "$RESULT" = success
  primer_view_components_tests:
    name: Primer ViewComponents (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Ruby
            tasks: test:components test:lib test:performance
          - suite: System
            tasks: test:system
          - suite: Accessibility
            tasks: test:accessibility
    defaults:
      run:
        working-directory: primer_view_components
    env:
      VIEW_COMPONENT_PATH: ../view_component
      RAILS_VERSION: '8.1.0'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: 'primer/view_components'
        path: 'primer_view_components'
        ref: 'main'
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: 'view_component'
        persist-credentials: false
    - name: Setup Ruby
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
      with:
        ruby-version: 4.0
        working-directory: 'primer_view_components'
    - name: Resolve Primer dependencies against this checkout
      run: bundle lock
    - name: Cache Ruby gems
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
      with:
        ruby-version: 4.0
        bundler-cache: true
        working-directory: 'primer_view_components'
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: |
          primer_view_components/package-lock.json
          primer_view_components/demo/package-lock.json
    - name: Install JavaScript dependencies
      run: |
        npm ci
        npm ci --prefix demo
    - name: Test with Rake
      shell: bash
      env:
        RAKE_TASKS: ${{ matrix.tasks }}
      run: |
        read -r -a tasks <<< "$RAKE_TASKS"
        bundle exec rake "${tasks[@]}"
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 4.0
        bundler-cache: true
    - name: Download coverage results
      uses: actions/download-artifact@v5
    - name: Collate simplecov
      run: |
        bundle exec rake coverage:report
