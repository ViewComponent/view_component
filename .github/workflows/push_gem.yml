name: Push Gem

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'ViewComponent/view_component'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    # GitHub environment configured on RubyGems
    environment: release

    steps:
      # Set up
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: false
          ruby-version: 4.0

      - name: Install dependencies without a cache
        run: bundle install
        env:
          BUNDLE_FROZEN: "true"

      # Release
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
