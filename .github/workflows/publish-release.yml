name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Only run if this is a release commit (created by script/release)
    if: startsWith(github.event.head_commit.message, 'release ')
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@d4526e8c8037b1e4c2537ccf714d62c4bacda6cb # v1.182.0
        with:
          bundler-cache: true

      - name: Harden runner
        uses: step-security/harden-runner@7c9f3a5f68b15e1e07de259dffa5cdb5133f32e0 # v2.9.1
        with:
          egress-policy: audit

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          script/publish
