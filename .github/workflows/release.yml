name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major version'
        required: true
        type: string
      minor:
        description: 'Minor version'
        required: true
        type: string
      patch:
        description: 'Patch version'
        required: true
        type: string
      pre:
        description: 'Pre-release version (leave empty for release)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-inputs:
    name: Validate version inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs are numeric
        run: |
          if ! [[ "${{ inputs.major }}" =~ ^[0-9]+$ ]]; then
            echo "Error: major version must be numeric"
            exit 1
          fi
          if ! [[ "${{ inputs.minor }}" =~ ^[0-9]+$ ]]; then
            echo "Error: minor version must be numeric"
            exit 1
          fi
          if ! [[ "${{ inputs.patch }}" =~ ^[0-9]+$ ]]; then
            echo "Error: patch version must be numeric"
            exit 1
          fi
          if [ -n "${{ inputs.pre }}" ] && ! [[ "${{ inputs.pre }}" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "Error: pre-release version contains invalid characters"
            exit 1
          fi

  prepare-release:
    name: Get current version
    needs: validate-inputs
    runs-on: ubuntu-latest
    outputs:
      current-major: ${{ steps.current-version.outputs.major }}
      current-minor: ${{ steps.current-version.outputs.minor }}
      current-patch: ${{ steps.current-version.outputs.patch }}
      current-pre: ${{ steps.current-version.outputs.pre }}
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7467c0571fcf3efa5d718588e # v4.1.6
        with:
          persist-credentials: false

      - name: Read current version
        id: current-version
        run: |
          major=$(grep "MAJOR = " lib/view_component/version.rb | grep -o "[0-9]\+")
          minor=$(grep "MINOR = " lib/view_component/version.rb | grep -o "[0-9]\+")
          patch=$(grep "PATCH = " lib/view_component/version.rb | grep -o "[0-9]\+")
          pre=$(grep "PRE = " lib/view_component/version.rb | grep -o "\"[^\"]*\"" | tr -d '"')
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT
          echo "patch=$patch" >> $GITHUB_OUTPUT
          echo "pre=$pre" >> $GITHUB_OUTPUT

      - name: Show current version
        run: |
          current="${{ steps.current-version.outputs.major }}.${{ steps.current-version.outputs.minor }}.${{ steps.current-version.outputs.patch }}"
          pre="${{ steps.current-version.outputs.pre }}"
          if [ -n "$pre" ]; then
            current="$current-$pre"
          fi
          echo "Current version: $current"
          echo ""
          echo "Release version will be: ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}${{ inputs.pre && format('-{0}', inputs.pre) || '' }}"

  release:
    name: Create release
    needs: [prepare-release, validate-inputs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7467c0571fcf3efa5d718588e # v4.1.6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@40952e3fccbed86cb109344f62e64d30d5487b6e1 # v1.180.1
        with:
          bundler-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ inputs.major }}
          MINOR: ${{ inputs.minor }}
          PATCH: ${{ inputs.patch }}
          PRE: ${{ inputs.pre }}
        run: |
          script/release "$MAJOR" "$MINOR" "$PATCH" "$PRE"
